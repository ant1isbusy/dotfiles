# BACKGROUND
background {
    monitor =
    #path = screenshot

    # Change this path to yours
    path = /home/antoine/Pictures/Wallpapers/black_aeroplane.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 150, 50
    outline_thickness = 2
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 240, 180, 0.8)
    inner_color = rgba(255, 240, 180, 0.5)
    font_color = $foreground
    font_size = 40
    font_family = JetBrainsMono Nerd Font Mono
    fade_on_empty = true
    rounding = 5
    check_color = rgb(204, 136, 34)
    fail_text = <span foreground="##ff0000">Wrong!</span>
    placeholder_text = <span foreground="##000004">Password please</span>
    hide_input = false
    position = 0, -580
    halign = center
    valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = rgba(255, 240, 180, 0.8)
  font_size = 600
  font_family = deutschlander
  halign = center
  valign = center
}

